[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onedrive-rclone"
version = "0.1.0"
description = "Copy a list of files to OneDrive with rclone and verify each one by QuickXorHash"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Kanan Hooper" }]

[project.urls]
Author = "https://github.com/kananlanginhooper"

[project.scripts]
onedrive-rclone = "onedrive_rclone:main"

[tool.setuptools]
py-modules = ["onedrive_rclone"]
